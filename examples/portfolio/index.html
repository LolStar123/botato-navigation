<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>botato / route lab</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="identity.css"></head><body>
<header><a href="https://lolstar123.github.io/just-a-little-further/">atul / botato</a><a href="https://github.com/LolStar123/botato-navigation">source</a></header>
<main>

<section class="toolbar"><label>map<select id="map"><option value="quarry">quarry</option><option value="ravine">ravine</option><option value="ruins">ruins</option></select></label><fieldset><legend>tool</legend><button data-tool="goal" aria-pressed="true">destination</button><button data-tool="wall" aria-pressed="false">add rock</button><button data-tool="erase" aria-pressed="false">erase</button></fieldset></section>
<div class="map-frame"><canvas id="world" width="960" height="600" tabindex="0" aria-describedby="map-help" aria-label="Interactive terrain with route planning and enemies that are fought automatically in range. Click to set a destination."></canvas></div>

<div class="below"><p id="status" role="status"></p><button id="pause">pause</button><button id="reset">reset</button></div>
<div class="metrics" aria-label="live route telemetry"><span><strong id="distance">—</strong><small>route</small></span><span><strong id="enemy-count">—</strong><small>enemies left</small></span><span><strong id="kills">0</strong><small>cleared</small></span><span class="map-legend"><i></i><small>destination</small><i class="enemy-key"></i><small>enemy</small></span></div>
<details><summary>settings &amp; help</summary><p id="map-help" class="map-help">Tap to move. Drag to draw or erase. Arrows move the destination; Enter applies the tool; Space pauses.</p><p class="search-readout"><span>search</span> <strong id="nodes">—</strong> nodes · <strong id="turns">—</strong> turns · <strong id="timing">—</strong> ms</p><label>wall clearance <input id="clearance" type="range" min="0" max="7" value="3"><output id="clearance-value">3 cells</output></label><label><input id="explored" type="checkbox"> show search</label><button id="export">export route</button></details>
<footer>Simulated terrain · <a href="https://github.com/LolStar123/botato-navigation#readme">README</a></footer></main><script type="module" src="app.mjs"></script></body></html>
